<!DOCTYPE html>

<head>

<title>Impressum - Slobodan Jelic</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/inter-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('/inter-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('/inter-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('/inter-latin-700-normal.woff2') format('woff2');}
:root{--navy:#141720;--navy-2:#1c202f;--accent:#c94f2a;--text-1:#f0ede8;--text-2:#8f95a8;--border:rgba(255,255,255,0.07);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--navy);color:var(--text-1);font-family:'Inter',sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;}
nav{position:sticky;top:0;background:rgba(20,23,32,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{font-size:15px;font-weight:900;color:var(--text-1);text-decoration:none;}
.nav-logo span{color:var(--accent);}
.nav-back{font-size:13px;color:var(--text-2);text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--text-1);}
.wrap{max-width:760px;margin:0 auto;padding:4rem 2rem;}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:2rem;color:var(--text-1);}
h2{font-size:1.25rem;font-weight:700;margin:2.5rem 0 .75rem;color:var(--text-1);}
p{font-size:14px;color:var(--text-2);margin-bottom:1rem;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
.divider{height:1px;background:var(--border);margin:2rem 0;}
footer{text-align:center;padding:2rem;font-size:12px;color:var(--text-2);border-top:1px solid var(--border);}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">SJ<span>.</span></a>
  <a class="nav-back" href="/">← Zurück zur Website</a>
</nav>

<div class="wrap">

  <div class="divider"></div>
  <p style="font-size:12px;">Quelle: <a href="https://www.e-recht24.de" target="_blank" rel="noopener">e-recht24.de</a></p>
</div>

<footer>

</footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
</html>
